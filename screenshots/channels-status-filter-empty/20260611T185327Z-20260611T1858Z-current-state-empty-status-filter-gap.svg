<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <rect width="1200" height="650" fill="#f6f8fb"/>
  <text x="48" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2937">Каналы → колонка «Статус» → фильтр</text>
  <text x="48" y="88" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">Схематичная фиксация текущего состояния: список фильтра содержит статусы, но нет варианта «Без статуса» для пустых ячеек.</text>
  <rect x="60" y="126" width="1080" height="398" rx="18" fill="#ffffff" stroke="#d7dde8"/>
  <rect x="96" y="168" width="310" height="310" rx="18" fill="#fbfbff" stroke="#e5e7eb"/>
  <text x="126" y="212" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">СТАТУС</text>
  <rect x="126" y="246" width="250" height="58" rx="12" fill="#ffffff" stroke="#a78bfa" stroke-width="3"/>
  <text x="148" y="282" font-family="Arial, sans-serif" font-size="19" fill="#9ca3af">СТАТУС</text>
  <g font-family="Arial, sans-serif" font-size="20" fill="#111827">
    <rect x="126" y="324" width="250" height="44" rx="8" fill="#f3f0ff"/>
    <text x="148" y="354">Договор подписан</text>
    <text x="148" y="402">Выдан код</text>
    <text x="148" y="450">Свободен</text>
  </g>
  <path d="M392 396 C470 396 505 396 560 396" stroke="#ef4444" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/></marker></defs>
  <rect x="592" y="250" width="430" height="190" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="622" y="292" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#b91c1c">Gap</text>
  <text x="622" y="328" font-family="Arial, sans-serif" font-size="17" fill="#374151">Нет отдельного варианта «Без статуса».</text>
  <text x="622" y="358" font-family="Arial, sans-serif" font-size="17" fill="#374151">Backend status_id filter принимает только UUID статусов.</text>
  <text x="622" y="388" font-family="Arial, sans-serif" font-size="17" fill="#374151">Пустые ячейки status_id IS NULL нельзя выбрать через UI.</text>
  <rect x="60" y="550" width="1080" height="66" rx="12" fill="#eef6ff" stroke="#bfdbfe"/>
  <text x="84" y="580" font-family="Arial, sans-serif" font-size="15" fill="#1e3a8a">Evidence: ChannelsList.tsx строит options из platformStatuses; backend search_mixin.py применяет Platform.status_id.in_(UUIDs).</text>
  <text x="84" y="604" font-family="Arial, sans-serif" font-size="15" fill="#1e3a8a">Это GitHub-visible схема current-state gap, без пользовательских данных из скриншота.</text>
</svg>
